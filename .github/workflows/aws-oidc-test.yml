
name: AWS OIDC Authentication Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticate:
    name: AWS OIDC Authentication
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const tokenResponse = await fetch(
              `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com`,
              {
                headers: {
                  Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
                }
              }
            );

            if (!tokenResponse.ok) {
              throw new Error("Unable to obtain GitHub OIDC token");
            }

            const result = await tokenResponse.json();
            const payload = JSON.parse(
              Buffer.from(result.value.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC issuer:", payload.iss);
            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418295691815:role/GitHubActions-SRE-Automation-Role
          aws-region: ap-south-2
          role-session-name: GitHubActionsSREOIDCTest

      - name: Verify AWS identity
        run: |
          echo "AWS OIDC authentication successful."
          aws sts get-caller-identity
